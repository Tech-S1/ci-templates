name: Go Release

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to check out for release
        type: string
        default: ""
      binary-package:
        description: Main package to build for release
        type: string
        default: .
      binary-name:
        description: Output binary name
        type: string
        default: app
      ldflags-package:
        description: Package path for -X version/commit/date ldflags
        type: string
        default: main

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/semantic-release.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

  artifacts:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          LDFLAGS_PACKAGE: ${{ inputs.ldflags-package }}
          BINARY_NAME: ${{ inputs.binary-name }}
          BINARY_PACKAGE: ${{ inputs.binary-package }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          artifact="${BINARY_NAME}-${GOOS}-${GOARCH}${EXT}"
          commit="$(git rev-parse HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w"
          ldflags="${ldflags} -X ${LDFLAGS_PACKAGE}.version=${TAG}"
          ldflags="${ldflags} -X ${LDFLAGS_PACKAGE}.commit=${commit}"
          ldflags="${ldflags} -X ${LDFLAGS_PACKAGE}.date=${date}"
          go build -ldflags="${ldflags}" -o "dist/${artifact}" "${BINARY_PACKAGE}"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: binary
          scan-ref: dist/${{ steps.build.outputs.artifact }}
          format: cyclonedx
          output: dist/${{ steps.build.outputs.artifact }}.cdx.json
          exit-code: "0"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and checksum
        env:
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          cosign sign-blob --yes \
            --bundle "dist/${ARTIFACT}.cosign.bundle" \
            "dist/${ARTIFACT}"
          cd dist
          sha256sum \
            "${ARTIFACT}" \
            "${ARTIFACT}.cdx.json" \
            "${ARTIFACT}.cosign.bundle" \
            > "${ARTIFACT}.checksums.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.build.outputs.artifact }}
            dist/${{ steps.build.outputs.artifact }}.cdx.json
            dist/${{ steps.build.outputs.artifact }}.cosign.bundle
            dist/${{ steps.build.outputs.artifact }}.checksums.txt
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ steps.build.outputs.artifact }}
          sbom-path: dist/${{ steps.build.outputs.artifact }}.cdx.json
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          gh release upload "${TAG}" \
            "dist/${ARTIFACT}" \
            "dist/${ARTIFACT}.cdx.json" \
            "dist/${ARTIFACT}.cosign.bundle" \
            "dist/${ARTIFACT}.checksums.txt" \
            --clobber
